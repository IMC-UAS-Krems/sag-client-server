# version: '3'

name: sagittarius-web
services:
  db:
    container_name: sagittarius-db
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - 5432:5432
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data:Z
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # command: ["postgres", "-c", "log_statement=all"]

  db-setup:
    image: node:20
    depends_on:
      - db
    restart: "no"
    volumes:
      - ./prisma/utils/init_database.ts:/app/init_database.ts
      - ./prisma/utils/init_database.sh:/app/init_database.sh
      - ./prisma/schema.prisma:/app/prisma/schema.prisma
      - ./prisma/migrations:/app/prisma/migrations

    command: ["sh", "-c", "/app/init_database.sh"]
    working_dir: /app
    environment:
      DATABASE_URL: ${DATABASE_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M


  server:
    container_name: sagittarius-server
    build:
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      db-setup:
        condition:
          service_completed_successfully
    ports:
      - ${WEB_SERVER_PORT}:9512
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      COMPILER_URL: ${COMPILER_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  client:
    container_name: sagittarius-client
    build:
      context: .
      args:
        - VITE_SERVER_URL=${SERVER_URL}
        - VITE_DEPLOYER_URL=${DEPLOYER_URL}
    depends_on:
      db-setup:
        condition:
          service_completed_successfully
    ports:
      - ${WEB_CLIENT_PORT}:8100
    environment:
      VITE_SERVER_URL: ${SERVER_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

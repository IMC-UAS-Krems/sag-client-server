# version: '3'

name: sagittarius-web
services:
  db:
    container_name: sagittarius-db
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - 5432:5432
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data:Z
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # command: ["postgres", "-c", "log_statement=all"]

  db-setup:
    build:
      context: ./prisma/
      dockerfile: utils/Dockerfile.db_setup
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  server:
    container_name: sagittarius-server
    build:
      context: .
      dockerfile: Dockerfile.server
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - ${WEB_SERVER_PORT}:9512
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: ${DATABASE_URL}
      COMPILER_URL: ${COMPILER_URL}
      VITE_COOKIES_EXPIRATION: ${VITE_COOKIES_EXPIRATION}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      VERIFICATION_EXPIRY: ${VERIFICATION_EXPIRY}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  client:
    container_name: sagittarius-client
    build:
      context: .
      args:
        - VITE_SERVER_URL=${SERVER_URL}
    depends_on:
      db-setup:
        condition: service_completed_successfully
    ports:
      - ${WEB_CLIENT_PORT}:8100
    environment:
      VITE_SERVER_URL: ${SERVER_URL}
      VITE_AUTH_CHECK_INTERVAL: ${VITE_AUTH_CHECK_INTERVAL}
      VITE_COOKIES_EXPIRATION: ${VITE_COOKIES_EXPIRATION}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
